apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-benchmark

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cloud-benchmark

  template:
    metadata:
      labels:
        app: cloud-benchmark

    spec:
      containers:
        - name: cloud-benchmark

          image: 869935096045.dkr.ecr.eu-central-1.amazonaws.com/cloud-benchmark:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - secretRef:
                name: database-secret

          env:
            - name: PROVIDER
              value: aws

          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3


          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

---

apiVersion: v1
kind: Service

metadata:
  name: cloud-benchmark-service

spec:
  type: LoadBalancer

  selector:
    app: cloud-benchmark

  ports:
    - port: 80
      targetPort: 8080